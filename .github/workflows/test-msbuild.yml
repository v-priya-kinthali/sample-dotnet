name: Test msbuild regex truncation

on:
  # push:
  #   branches:
  #     - test-588
  workflow_dispatch:

jobs:
  regex-check:
    runs-on: ubuntu-latest
    steps:
      - name: Test #6 regex — message ending in brackets
        shell: node {0}
        run: |
          const regex = /^([^\s].*)\s+:\s+(error|warning)\s+([a-zA-Z]+(?<!MSB)\d+):\s*(.*?)(?:\s+\[(.*?)\])?$/;

          const cases = [
            {
              name: "Message ENDS with a bracket token, NO project suffix",
              line: "/repo/sample.csproj : warning NU1900: See advisory [GHSA-ghhp-997w-qr28]",
              expectMessage: "See advisory [GHSA-ghhp-997w-qr28]",
              expectFromPath: undefined
            },
            {
              name: "Message ENDS with bracketed URL, NO project suffix",
              line: "/repo/sample.csproj : warning NU1901: More info [https://nuget.example/advisories]",
              expectMessage: "More info [https://nuget.example/advisories]",
              expectFromPath: undefined
            }
          ];

          let failed = 0;
          for (const c of cases) {
            const m = c.line.match(regex);
            const message  = m ? m[4] : undefined;
            const fromPath = m ? m[5] : undefined;
            const ok = message === c.expectMessage && fromPath === c.expectFromPath;
            console.log(`\n${ok ? "✅ PASS" : "❌ FAIL"} — ${c.name}`);
            console.log(`   message : ${JSON.stringify(message)}`);
            console.log(`   fromPath: ${JSON.stringify(fromPath)}`);
            if (!ok) {
              failed++;
              console.log(`   expected message : ${JSON.stringify(c.expectMessage)}`);
              console.log(`   expected fromPath: ${JSON.stringify(c.expectFromPath)}`);
            }
          }

          if (failed > 0) { console.log(`\n${failed} case(s) failed.`); process.exit(1); }
          console.log("\nAll cases passed.");